<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Reset Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --blue: #2563eb;
            --purple: #7c3aed;
            --pink: #db2777;
            --bg: #020617;
            --text: #f8fafc;
            --muted: #9aa8c7;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            background:

                radial-gradient(
                    circle at 10% 10%,
                    rgba(37, 99, 235, 0.30),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 15%,
                    rgba(236, 72, 153, 0.25),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(124, 58, 237, 0.25),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #020617,
                    #071337 45%,
                    #10072d
                );
        }

        .container {

            width: 440px;
            max-width: 100%;

            padding: 38px;

            border-radius: 28px;

            border:
                1px solid
                rgba(139, 92, 246, 0.35);

            background:

                linear-gradient(
                    145deg,
                    rgba(18, 31, 75, 0.92),
                    rgba(5, 13, 39, 0.86)
                );

            box-shadow:

                0 30px 80px
                rgba(0, 0, 0, 0.50),

                0 0 60px
                rgba(99, 102, 241, 0.10);

            backdrop-filter: blur(20px);
        }

        .logo {

            text-align: center;

            margin-bottom: 28px;
        }

        .logo-icon {

            width: 68px;
            height: 68px;

            margin: 0 auto 14px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 20px;

            font-size: 34px;

            background:

                linear-gradient(
                    135deg,
                    rgba(59, 130, 246, 0.25),
                    rgba(139, 92, 246, 0.30),
                    rgba(236, 72, 153, 0.25)
                );

            border:
                1px solid
                rgba(139, 92, 246, 0.35);
        }

        h1 {

            font-size: 34px;

            background:

                linear-gradient(
                    135deg,
                    #60a5fa,
                    #a78bfa,
                    #f472b6
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {

            margin-top: 8px;

            color: var(--muted);

            font-size: 14px;

            text-align: center;
        }

        .form-group {

            margin-bottom: 18px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #dbeafe;

            font-size: 13px;

            font-weight: 700;
        }

        input {

            width: 100%;

            padding: 14px 15px;

            border-radius: 11px;

            border:
                1px solid
                rgba(99, 102, 241, 0.25);

            background:
                rgba(5, 14, 40, 0.78);

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.25s ease;
        }

        input:focus {

            border-color: #8b5cf6;

            box-shadow:

                0 0 0 3px
                rgba(139, 92, 246, 0.12);
        }

        .submit-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 11px;

            color: white;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            background:

                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed,
                    #db2777
                );

            transition: 0.25s ease;
        }

        .submit-btn:hover {

            transform: translateY(-2px);
        }

        .back-login {

            margin-top: 18px;

            text-align: center;
        }

        .back-login a {

            color: #93c5fd;

            font-size: 13px;

            font-weight: 700;

            text-decoration: none;
        }

        .message {

            display: none;

            margin-top: 16px;

            padding: 12px 14px;

            border-radius: 11px;

            font-size: 13px;

            font-weight: 700;
        }

        .message.success {

            display: block;

            color: #86efac;

            background:
                rgba(22, 163, 74, 0.12);

            border:
                1px solid
                rgba(74, 222, 128, 0.25);
        }

        .message.error {

            display: block;

            color: #fda4af;

            background:
                rgba(244, 63, 94, 0.10);

            border:
                1px solid
                rgba(244, 63, 94, 0.25);
        }

        .footer {

            margin-top: 24px;

            text-align: center;

            color: #64748b;

            font-size: 12px;
        }

        @media (max-width: 480px) {

            .container {

                padding: 30px 22px;

                border-radius: 23px;
            }

            h1 {

                font-size: 30px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">

        <div class="logo-icon">
            🚀
        </div>

        <h1>
            TaskFlow
        </h1>

        <p class="subtitle">
            Create a new password
        </p>

    </div>


    <form id="resetPasswordForm">


        <div class="form-group">

            <label>
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter your new password"
                minlength="6"
                required>

        </div>


        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your new password"
                minlength="6"
                required>

        </div>


        <button
            type="submit"
            class="submit-btn">

            Reset Password 🔐

        </button>


    </form>


    <div
        id="message"
        class="message">
    </div>


    <div class="back-login">

        <a href="auth.html">

            ← Back to Login

        </a>

    </div>


    <div class="footer">

        🚀 TaskFlow • Smart Task Management

    </div>


</div>


<script>

const API_URL =
    "http://127.0.0.1:8000";


/* =====================================
   GET TOKEN FROM URL
===================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const token =
    params.get("token");


/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =====================================
   CHECK TOKEN
===================================== */

if (!token) {

    showMessage(
        "Invalid or missing password reset token.",
        "error"
    );

    document
        .getElementById(
            "resetPasswordForm"
        )
        .style.display = "none";
}


/* =====================================
   RESET PASSWORD
===================================== */

document
    .getElementById(
        "resetPasswordForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const newPassword =
                document
                    .getElementById(
                        "newPassword"
                    )
                    .value;

            const confirmPassword =
                document
                    .getElementById(
                        "confirmPassword"
                    )
                    .value;


            /* PASSWORD MATCH */

            if (
                newPassword !==
                confirmPassword
            ) {

                showMessage(
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/auth/reset-password`,
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    token: token,

                                    new_password:
                                        newPassword

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    showMessage(

                        data.detail ||
                        "Password reset failed.",

                        "error"

                    );

                    return;
                }


                showMessage(

                    data.message ||
                    "Password reset successfully! 🎉",

                    "success"

                );


                document
                    .getElementById(
                        "resetPasswordForm"
                    )
                    .reset();


                setTimeout(

                    function() {

                        window.location.href =
                            "auth.html";

                    },

                    2000

                );

            }


            catch (error) {

                console.error(error);

                showMessage(

                    "Cannot connect to TaskFlow server.",

                    "error"

                );

            }

        }
    );

</script>


</body>

</html>
